# PersonalAI - a fully local, offline AI assistant (chat, story writing,
# coding help) built on top of Ollama. Standalone project: no dependency
# on any other repo. See README.md / SETUP.md.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personalai"
version = "0.1.0"
description = "A local, offline personal AI assistant for chat, story writing, and coding help"
requires-python = ">=3.11"

[project.scripts]
myai = "personalai.cli:main"

[tool.setuptools.packages.find]
include = ["personalai*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E722", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
