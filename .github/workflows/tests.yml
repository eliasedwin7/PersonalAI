name: Tests

# windows-latest, not ubuntu: this project is developed and used on
# Windows (pyttsx3's SAPI5 backend, sounddevice/faster-whisper mic
# support, Windows-specific paths in a couple of tests) - running CI on
# the same OS the app actually targets catches real regressions instead
# of just "does it import on Linux."

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        env:
          # No real display in CI - GUI tests (test_gui.py) construct
          # real Qt widgets via pytest-qt, offscreen renders them
          # without an actual window/desktop.
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q
